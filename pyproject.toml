[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-agent-regression"
version = "0.1.0"
description = "Agent Regression and Mutation Testing: reproducible offline experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-regression = "agent_regression.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
